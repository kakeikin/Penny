<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Penny — Personal Accounting</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="format.js"></script>
  <script src="citations.js"></script>
  <script src="evidence-viewer.js"></script>
  <style>
    .card  { @apply bg-white rounded-xl shadow-sm border border-gray-100 p-4; }
    .btn   { @apply px-4 py-2 rounded-lg text-sm font-medium transition; }
    .btn-primary { @apply btn bg-[#4A9B72] text-white hover:bg-[#3d8a65]; }
    .btn-ghost   { @apply btn text-gray-600 hover:bg-gray-100; }
    .badge-debit  { @apply inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-red-100 text-red-700; }
    .badge-credit { @apply inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-green-100 text-green-700; }
    .badge-pending   { @apply inline-flex items-center px-2 py-0.5 rounded text-xs bg-yellow-100 text-yellow-700; }
    .badge-confirmed { @apply inline-flex items-center px-2 py-0.5 rounded text-xs bg-green-100 text-green-700; }

    * { box-sizing: border-box; }

    body {
      background: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top header */
    .mobile-header {
      background: #6DC4A0;
      color: #fff;
      padding: 48px 16px 16px;
      flex-shrink: 0;
    }
    .mobile-header .logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }
    .mobile-header .subtitle {
      font-size: 11px;
      opacity: 0.75;
      margin-top: 2px;
    }

    /* Main content */
    #app {
      flex: 1;
      overflow-y: auto;
      padding: 16px 12px 72px;
      -webkit-overflow-scrolling: touch;
    }

    /* Bottom tab bar */
    .bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 60px;
      background: #fff;
      border-top: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding-bottom: 4px;
      z-index: 100;
    }
    .bottom-nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      text-decoration: none;
      color: #9ca3af;
      font-size: 9px;
      font-weight: 500;
      padding: 4px 10px;
      border-radius: 8px;
      transition: color 0.15s;
      -webkit-tap-highlight-color: transparent;
    }
    .bottom-nav a .nav-icon { width: 22px; height: 22px; display: block; }
    .bottom-nav a .nav-icon svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .bottom-nav a.active { color: #4A9B72; }
  </style>
</head>
<body>

  <!-- Demo mode banner (only shown when ?demo=true) -->
  <div id="demo-banner" style="display:none;background:#f59e0b;color:#fff;text-align:center;font-size:12px;font-weight:700;padding:6px 12px;letter-spacing:0.3px;flex-shrink:0;">
    🧪 Demo Mode — your data is private &amp; clears when you close this tab
  </div>

  <!-- Header -->
  <div class="mobile-header">
    <div class="logo">Penny 💚</div>
    <div class="subtitle" id="header-subtitle">AI-Powered Personal Finance</div>
  </div>

  <!-- Page content -->
  <main id="app"></main>

  <!-- Bottom navigation -->
  <nav class="bottom-nav">
    <a href="#dashboard"    class="bottom-nav-link" data-page="dashboard">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V20a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z"/><path d="M9 21V12h6v9"/></svg></span>Home
    </a>
    <a href="#upload"       class="bottom-nav-link" data-page="upload">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></span>Upload
    </a>
    <a href="#transactions" class="bottom-nav-link" data-page="transactions">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></span>Records
    </a>
    <a href="#reports"      class="bottom-nav-link" data-page="reports">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6"  y1="20" x2="6"  y2="14"/></svg></span>Reports
    </a>
    <a href="#advisor"      class="bottom-nav-link" data-page="advisor">
      <span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M12 2a4 4 0 014 4v1h1a2 2 0 012 2v3a2 2 0 01-2 2h-1v1a4 4 0 01-8 0v-1H7a2 2 0 01-2-2V9a2 2 0 012-2h1V6a4 4 0 014-4z"/><circle cx="9" cy="10" r="0.5" fill="currentColor"/><circle cx="15" cy="10" r="0.5" fill="currentColor"/></svg></span>AI
    </a>
  </nav>

  <script src="pages/dashboard.js"></script>
  <script src="pages/upload.js"></script>
  <script src="pages/transactions.js"></script>
  <script src="pages/manual-entry.js"></script>
  <script src="pages/reports.js"></script>
  <script src="pages/settings.js"></script>
  <script src="pages/advisor.js"></script>

  <script>
    const PAGES = { dashboard, upload, transactions, 'new': manualEntry, reports, settings, advisor };

    function setActive(page) {
      document.querySelectorAll('.bottom-nav-link').forEach(a => {
        a.classList.toggle('active', a.dataset.page === page);
      });
    }

    function route() {
      const page = location.hash.replace('#', '') || 'dashboard';
      const render = PAGES[page] || PAGES.dashboard;
      setActive(page);
      document.getElementById('app').innerHTML = '';
      render(document.getElementById('app'));
    }

    window.addEventListener('hashchange', route);
    route();

    // ── Demo mode UI init ───────────────────────────────────────────────────
    if (Session.isDemo) {
      document.getElementById('demo-banner').style.display = 'block';
      document.getElementById('header-subtitle').textContent = 'Demo Mode 🧪';
    }
  </script>

  <script>
    // Web Push registration — VAPID public key (replace after generating keys)
    const VAPID_PUBLIC_KEY = 'BKmkw_YYB4kz8WNbnII60aIcoTfC3MYmNahsqEbgiLo1LlKJ8CdtwGe2E47pVzGxsdBzI2a-3J05nwwHurn_YxY';

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - base64String.length % 4) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = window.atob(base64);
      return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
    }

    async function registerPush() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      const reg = await navigator.serviceWorker.register('/sw.js');
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') return;
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
      });
      await fetch(`${window.API_BASE}/api/push/subscribe`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ subscription: JSON.stringify(sub), endpoint: sub.endpoint }),
      });
      console.log('Push notifications registered');
    }

    window.addEventListener('load', () => registerPush().catch(console.warn));
  </script>
</body>
</html>
